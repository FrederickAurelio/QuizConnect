server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Prepared uploads are capped at 8MB in the app; allow headroom for multipart encoding.
    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/ld+json application/manifest+json;

    # Hashed Vite bundles — cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /og-image.jpg {
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # App routes should not be indexed (thin / auth / ephemeral), but crawlers
    # must still be able to fetch them so WhatsApp / X can read OG tags.
    location ~ ^/(quiz-set|create|ai-generate|edit|history|game) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        rewrite ^ /index.html break;
    }

    # SPA: try file, then dir, then index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to Express
    location ^~ /api {
        proxy_pass http://app:2000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy Socket.IO to Express
    location ^~ /socket.io {
        proxy_pass http://app:2000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
